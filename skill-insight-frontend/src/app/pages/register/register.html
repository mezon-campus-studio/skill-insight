<div class="min-h-screen flex items-center justify-center 
            bg-gradient-to-br from-gray-50 via-white to-gray-100 px-4">

  <div class="w-full max-w-md bg-white rounded-3xl 
              shadow-xl border border-gray-100 p-8 sm:p-10 relative">

    <div *ngIf="successMessage"
         class="absolute top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg animate-fade">
      {{ successMessage }}
    </div>

    <div *ngIf="error"
         class="absolute top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg animate-fade">
      {{ error }}
    </div>

    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold text-gray-900">ĐĂNG KÝ</h2>
      <p class="text-gray-500 text-sm mt-1">Tạo tài khoản mới</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-5">

      <div>
        <label class="label">Họ và tên</label>
        <input type="text" formControlName="full_name" class="input" />

        <div *ngIf="f.full_name.touched && f.full_name.errors"
             class="text-red-500 text-sm mt-1">
          Vui lòng nhập họ và tên
        </div>
      </div>

      <div>
        <label class="label">Email</label>
        <input type="email" formControlName="email" class="input" />

        <div *ngIf="f.email.touched && f.email.errors"
             class="text-red-500 text-sm mt-1">
          {{ getEmailError() }}
        </div>
      </div>

      <div>
        <label class="label">Mật khẩu</label>

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="input pr-14"
            placeholder="••••••••"
          />

          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors"
          >
            <svg
              *ngIf="!showPassword"
              viewBox="0 0 24 24"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M3 3L21 21M10.58 10.58A2 2 0 0013.42 13.42M9.88 5.09A9.77 9.77 0 0112 5c5 0 9.27 3.11 11 7a11.94 11.94 0 01-4.53 4.02M6.71 6.72A11.94 11.94 0 012 12c1.73 3.89 6 7 10 7 1.61 0 3.14-.35 4.53-.98"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <svg
              *ngIf="showPassword"
              viewBox="0 0 24 24"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12z"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle
                cx="12"
                cy="12"
                r="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <div
          *ngIf="f.password.touched && f.password.errors"
          class="text-red-500 text-sm mt-1"
        >
          {{ getPasswordError() }}
        </div>
      </div>

      <div>
        <label class="label">Nhập lại mật khẩu</label>

        <div class="relative">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            class="input pr-14"
            placeholder="••••••••"
          />

          <button
            type="button"
            (click)="toggleConfirmPassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors"
          >
            <svg
              *ngIf="!showConfirmPassword"
              viewBox="0 0 24 24"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M3 3L21 21M10.58 10.58A2 2 0 0013.42 13.42M9.88 5.09A9.77 9.77 0 0112 5c5 0 9.27 3.11 11 7a11.94 11.94 0 01-4.53 4.02M6.71 6.72A11.94 11.94 0 012 12c1.73 3.89 6 7 10 7 1.61 0 3.14-.35 4.53-.98"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <svg
              *ngIf="showConfirmPassword"
              viewBox="0 0 24 24"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12z"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle
                cx="12"
                cy="12"
                r="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <div
          *ngIf="f.confirmPassword.touched && f.confirmPassword.value !== f.password.value"
          class="text-red-500 text-sm mt-1"
        >
          Mật khẩu nhập lại không khớp
        </div>
      </div>

      <div class="flex items-center gap-2 text-sm">
        <input type="checkbox" formControlName="acceptTerms" class="accent-blue-600">
        <span class="text-gray-600">
          Tôi đồng ý với 
          <a routerLink="/terms" class="text-blue-600 font-semibold hover:underline">
            Điều khoản sử dụng
          </a>
        </span>
      </div>

      <button
        type="submit"
        [disabled]="loading || !f.acceptTerms.value"
        class="btn"
      >
        <span *ngIf="!loading">Đăng ký</span>
        <span *ngIf="loading">Đang xử lý...</span>
      </button>

    </form>

    <div class="text-center mt-6 text-sm text-gray-500">
      Đã có tài khoản?
      <span
        (click)="goLogin()"
        class="text-blue-600 font-semibold cursor-pointer hover:underline ml-1"
      >
        Đăng nhập
      </span>
    </div>

  </div>
</div>
