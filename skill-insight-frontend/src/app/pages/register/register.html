<div class="min-h-screen flex items-center justify-center 
            bg-gradient-to-br from-gray-50 via-white to-gray-100 px-4">

  <div class="w-full max-w-md bg-white rounded-3xl 
              shadow-xl border border-gray-100 p-8 sm:p-10 relative">

    <div *ngIf="successMessage"
         class="absolute top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg animate-fade">
      {{ successMessage }}
    </div>

    <div *ngIf="error"
         class="absolute top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg animate-fade">
      {{ error }}
    </div>

    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold text-gray-900">ĐĂNG KÝ</h2>
      <p class="text-gray-500 text-sm mt-1">Tạo tài khoản mới</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-5">

      <div>
        <label class="label">Họ và tên</label>
        <input type="text" formControlName="full_name" class="input" />

        <div *ngIf="f.full_name.touched && f.full_name.errors"
             class="text-red-500 text-sm mt-1">
          Vui lòng nhập họ và tên
        </div>
      </div>

      <div>
        <label class="label">Email</label>
        <input type="email" formControlName="email" class="input" />

        <div *ngIf="f.email.touched && f.email.errors"
             class="text-red-500 text-sm mt-1">
          {{ getEmailError() }}
        </div>
      </div>

      <div>
        <label class="label">Mật khẩu</label>

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="input pr-10"
          />

          <span class="eye" (click)="togglePassword()">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" class="icon">
              <path d="M3 3L21 21" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" class="icon">
              <circle cx="12" cy="12" r="3" stroke-width="2"></circle>
            </svg>
          </span>
        </div>

        <div *ngIf="f.password.touched && f.password.errors"
             class="text-red-500 text-sm mt-1">
          {{ getPasswordError() }}
        </div>
      </div>

      <div>
        <label class="label">Nhập lại mật khẩu</label>

        <div class="relative">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            class="input pr-10"
          />

          <span class="eye" (click)="toggleConfirmPassword()">
            <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" class="icon">
              <path d="M3 3L21 21" stroke-width="2"/>
            </svg>
            <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" class="icon">
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>

        <div *ngIf="f.confirmPassword.touched && f.confirmPassword.value !== f.password.value"
             class="text-red-500 text-sm mt-1">
          Mật khẩu nhập lại không khớp
        </div>
      </div>

      <div class="flex items-center gap-2 text-sm">
        <input type="checkbox" formControlName="acceptTerms" class="accent-blue-600">
        <span class="text-gray-600">
          Tôi đồng ý với 
          <a routerLink="/terms" class="text-blue-600 font-semibold hover:underline">
            Điều khoản sử dụng
          </a>
        </span>
      </div>

      <button
        type="submit"
        [disabled]="loading || !f.acceptTerms.value"
        class="btn"
      >
        <span *ngIf="!loading">Đăng ký</span>
        <span *ngIf="loading">Đang xử lý...</span>
      </button>

    </form>

    <div class="text-center mt-6 text-sm text-gray-500">
      Đã có tài khoản?
      <span
        (click)="goLogin()"
        class="text-blue-600 font-semibold cursor-pointer hover:underline ml-1"
      >
        Đăng nhập
      </span>
    </div>

  </div>
</div>
