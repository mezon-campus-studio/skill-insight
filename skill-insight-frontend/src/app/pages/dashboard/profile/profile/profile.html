<div class="max-w-3xl mx-auto p-4 md:p-8">
  <div class="bg-white rounded-[40px] shadow-2xl shadow-blue-100/50 border border-gray-50 overflow-hidden">
    
    <!-- Header màu xanh Gradient -->
    <div class="h-32 bg-gradient-to-r from-blue-600 to-indigo-700 relative"></div>

    <div class="px-8 pb-10 -mt-16">
      <div class="flex flex-col items-center sm:items-start sm:flex-row gap-6 mb-10">
        <!-- AVATAR & UPLOAD -->
        <div class="relative group">
          <div class="w-32 h-32 rounded-[35% ] bg-white p-1.5 shadow-xl">
            <div class="w-full h-12 h-full rounded-[30%] bg-slate-100 overflow-hidden flex items-center justify-center border border-gray-100">
              <img *ngIf="user.avatar_url" [src]="user.avatar_url" class="w-full h-full object-cover">
              <span *ngIf="!user.avatar_url" class="text-4xl font-black text-blue-500 uppercase">{{user.full_name?.charAt(0)}}</span>
            </div>
          </div>
          <label class="absolute bottom-0 right-0 bg-blue-600 text-white p-2.5 rounded-2xl shadow-lg cursor-pointer hover:bg-blue-700 transition-all scale-90 group-hover:scale-100">
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
            </svg>
            <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*">
          </label>
        </div>

        <div class="mt-16 sm:mt-18 text-center sm:text-left">
          <h2 class="text-3xl font-black text-slate-800 uppercase italic tracking-tighter">{{user.full_name}}</h2>
          <p class="text-blue-600 font-bold text-sm uppercase tracking-widest">{{user.role || 'Thành viên'}}</p>
        </div>
      </div>

      <!-- FORM THÔNG TIN -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="space-y-6">
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Họ và tên</label>
            <input [(ngModel)]="user.full_name" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 font-bold text-slate-700 transition-all border-none" placeholder="Nhập họ tên...">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Email liên hệ</label>
            <input [value]="user.email" disabled class="w-full px-6 py-4 bg-slate-100 rounded-2xl text-slate-400 font-bold cursor-not-allowed border-none">
          </div>
        </div>

        <div class="space-y-6">
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Tiểu sử (Bio)</label>
            <textarea [(ngModel)]="user.bio" rows="4" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 font-medium text-slate-700 transition-all border-none resize-none" placeholder="Giới thiệu ngắn về bản thân..."></textarea>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="mt-12 flex flex-col sm:flex-row gap-4 border-t border-slate-100 pt-10">
        <button (click)="update()" [disabled]="loading" class="flex-1 bg-blue-600 text-white py-5 rounded-3xl font-black uppercase italic tracking-widest hover:bg-blue-700 transition active:scale-95 shadow-xl shadow-blue-200 disabled:opacity-50">
          {{ loading ? 'Đang lưu...' : 'Lưu thay đổi' }}
        </button>
        
        <button (click)="goPassword()" class="flex-1 bg-white text-slate-700 border-2 border-slate-100 py-5 rounded-3xl font-black uppercase italic tracking-widest hover:bg-slate-50 transition active:scale-95">
          {{ user.hasPassword ? 'Đổi mật khẩu' : 'Thiết lập mật khẩu' }}
        </button>
      </div>

    </div>
  </div>
</div>
