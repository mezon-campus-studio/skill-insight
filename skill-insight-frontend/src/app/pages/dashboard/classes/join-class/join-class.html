<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">

  <div class="w-full max-w-md rounded-2xl bg-white shadow-lg p-8">

    <h1 class="text-2xl font-bold text-gray-800">
      Tham gia lớp học
    </h1>

    <p class="mt-2 text-sm text-gray-500">
      Nhập mã lớp do giáo viên cung cấp.
    </p>

    <div class="mt-6">

      <label
        class="mb-2 block text-sm font-medium text-gray-700"
      >
        Mã lớp
      </label>

      <input
        type="text"
        [(ngModel)]="classCode"
        placeholder="VD: 8KACUNBV"
        class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
      />

    </div>

    <button
      (click)="joinClass()"
      [disabled]="loading"
      class="mt-6 w-full rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700 disabled:opacity-50"
    >

      <span *ngIf="!loading">
        Tham gia lớp
      </span>

      <span *ngIf="loading">
        Đang tham gia...
      </span>

    </button>

  </div>

</div>
