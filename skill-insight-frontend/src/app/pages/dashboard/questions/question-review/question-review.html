<div
  *ngIf="loading"
  class="p-10 text-center"
>
  Đang tải...
</div>

<div
  *ngIf="question"
  class="p-6 space-y-6"
>

  <div class="flex items-center justify-between">

    <div>

      <h1
        class="text-3xl font-bold text-gray-800"
      >
        Duyệt câu hỏi
      </h1>

      <p class="text-gray-500 mt-1">
        Kiểm tra nội dung trước khi duyệt
      </p>

    </div>

    <button
      *ngIf="!question.is_approved"
      (click)="approveQuestion()"
      class="px-5 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold"
    >
      Duyệt câu hỏi
    </button>

  </div>

  <div
    class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"
  >

    <div class="mb-5">

      <h2
        class="text-lg font-bold text-gray-800 mb-2"
      >
        Nội dung câu hỏi
      </h2>

      <p class="text-gray-700 leading-relaxed">
        {{ question.content }}
      </p>

    </div>

    <div class="mb-5">

      <h2
        class="text-lg font-bold text-gray-800 mb-3"
      >
        Danh sách đáp án
      </h2>

      <div
        *ngFor="let answer of question.answers"
        class="border rounded-xl p-4 mb-3"
        [ngClass]="{
          'border-green-500 bg-green-50':
            answer.is_correct
        }"
      >

        <div class="flex items-center justify-between">

          <span>
            {{ answer.answer_text }}
          </span>

          <span
            *ngIf="answer.is_correct"
            class="text-green-600 font-semibold"
          >
            Đáp án đúng
          </span>

        </div>

      </div>

    </div>

    <div
      *ngIf="question.explanation"
    >

      <h2
        class="text-lg font-bold text-gray-800 mb-2"
      >
        Giải thích
      </h2>

      <p class="text-gray-700">
        {{ question.explanation }}
      </p>

    </div>

  </div>

</div>
