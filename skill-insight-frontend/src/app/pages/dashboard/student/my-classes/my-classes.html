<div class="p-6 max-w-6xl mx-auto">

  <!-- HEADER -->
  <div
    class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">

    <div>

      <h2
        class="text-3xl font-black text-[#1a2b4b] uppercase italic tracking-tighter">

        Lớp học của tôi

      </h2>

      <p
        class="text-gray-400 font-medium mt-1">

        Danh sách các lớp bạn đang tham gia

      </p>

    </div>

    <button

      routerLink="/dashboard/join-class"

      class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg hover:bg-blue-700 transition">

      + THAM GIA LỚP

    </button>

  </div>

  <!-- LOADING -->
  <div
    *ngIf="loading"
    class="text-center py-20">

    Đang tải...

  </div>

  <!-- LIST -->
  <div

    *ngIf="!loading && myClasses.length"

    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

    <div

      *ngFor="let item of myClasses"

      class="bg-white rounded-3xl shadow border border-gray-100 overflow-hidden hover:-translate-y-1 transition">

      <div
        class="bg-gradient-to-r from-blue-600 to-indigo-600 h-28">
      </div>

      <div class="p-6 -mt-10">

        <div
          class="w-20 h-20 rounded-3xl bg-white shadow flex items-center justify-center text-3xl font-bold">

          {{ item.class_name.charAt(0) }}

        </div>

        <h3
          class="mt-4 text-xl font-bold">

          {{ item.class_name }}

        </h3>

        <p
          class="text-gray-500">

          Mã lớp:
          {{ item.class_code }}

        </p>

        <div
          class="mt-5 border-t pt-4">

          <p
            class="text-xs text-gray-400 uppercase">

            Giáo viên

          </p>

          <p
            class="font-semibold">

            {{ item.teacher?.full_name }}

          </p>

        </div>

        <button

          [routerLink]="[
            '/dashboard/my-classes',
            item.class_id
          ]"

          class="w-full mt-6 rounded-xl bg-blue-50 py-3 font-bold text-blue-600 hover:bg-blue-600 hover:text-white transition">

          VÀO LỚP

        </button>

      </div>

    </div>

  </div>

  <!-- EMPTY -->
  <div

    *ngIf="!loading && myClasses.length===0"

    class="bg-white rounded-3xl p-20 text-center shadow">

    <h3
      class="text-2xl font-bold">

      Bạn chưa tham gia lớp nào

    </h3>

    <p
      class="mt-2 text-gray-500">

      Hãy nhập mã lớp để tham gia.

    </p>

    <button

      routerLink="/dashboard/join-class"

      class="mt-8 bg-blue-600 text-white px-8 py-3 rounded-xl font-bold">

      THAM GIA LỚP

    </button>

  </div>

</div>
